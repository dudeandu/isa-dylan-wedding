    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 2rem 0 4rem; background: #faf9f6; color: #1a1a1a; font-family: 'Montserrat', sans-serif; text-align: center; }
        .header-script { margin: 1rem 0 0; color: #333; font-family: 'Great Vibes', cursive; font-size: 4rem; font-weight: 400; }
        .subtitle { margin: 0.5rem 0 2rem; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; }
        nav ul { display: flex; justify-content: center; gap: 2rem; margin: 0 1rem 3rem; padding: 0; list-style: none; flex-wrap: wrap; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; }
        nav a { color: #666; text-decoration: none; padding-bottom: 2px; }
        nav a.active, nav a:hover { color: #000; border-bottom: 1px solid #000; }
        .photo-collage { width: min(1120px, calc(100% - 3rem)); margin: auto; display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 72px; grid-auto-flow: dense; gap: 10px; }
        figure { min-width: 0; min-height: 0; margin: 0; overflow: hidden; background: #e8e4dc; }
        figure img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform 0.55s ease; }
        figure:hover img { transform: scale(1.025); }
        figure:nth-child(1)  { grid-column: span 5; grid-row: span 7; }
        figure:nth-child(2)  { grid-column: span 3; grid-row: span 4; }
        figure:nth-child(3)  { grid-column: span 4; grid-row: span 6; }
        figure:nth-child(4)  { grid-column: span 3; grid-row: span 5; }
        figure:nth-child(5)  { grid-column: span 4; grid-row: span 4; }
        figure:nth-child(6)  { grid-column: span 5; grid-row: span 7; }
        figure:nth-child(7)  { grid-column: span 4; grid-row: span 5; }
        figure:nth-child(8)  { grid-column: span 4; grid-row: span 6; }
        figure:nth-child(9)  { grid-column: span 4; grid-row: span 5; }
        figure:nth-child(10) { grid-column: span 5; grid-row: span 7; }
        figure:nth-child(11) { grid-column: span 3; grid-row: span 4; }
        figure:nth-child(12) { grid-column: span 4; grid-row: span 5; }
        figure:nth-child(13) { grid-column: span 4; grid-row: span 5; }
        figure:nth-child(14) { grid-column: span 4; grid-row: span 4; }
        figure:nth-child(15) { grid-column: span 4; grid-row: span 6; }
        .caption { margin: 1.3rem auto 0; color: #777; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; }
        @media (max-width: 520px) {
            body { padding-top: 1rem; }
            .header-script { font-size: 3.4rem; }
            nav ul { gap: 1.5rem; margin-bottom: 2rem; }
            .photo-collage { width: calc(100% - 1rem); grid-template-columns: repeat(4, 1fr); grid-auto-rows: 64px; gap: 6px; }
            .photo-collage figure { grid-column: span 2; grid-row: span 4; }
            .photo-collage figure:nth-child(1),
            .photo-collage figure:nth-child(6),
            .photo-collage figure:nth-child(10),
            .photo-collage figure:nth-child(15) { grid-column: span 4; grid-row: span 6; }
            .photo-collage figure:nth-child(3),
            .photo-collage figure:nth-child(8),
            .photo-collage figure:nth-child(12) { grid-row: span 5; }
        }
    </style>
